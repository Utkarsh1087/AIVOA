version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivoa-qms-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PRIMARY_LLM=${PRIMARY_LLM:-openai/gpt-oss-20b}
      - SECONDARY_LLM=${SECONDARY_LLM:-openai/gpt-oss-120b}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./aivoa_qms.db}
      - ENVIRONMENT=production
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
    volumes:
      - backend-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivoa-qms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
